            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 10px;
            margin-right: 5px;
            border: 1px solid #e1e8ed;

            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
            color: #444;
            font-size: 15px;
            white-space: pre-wrap;
            background-color: #fafbfc;
            padding: 15px;

</head>

            id: 104, chapter: "第15章 风险管理与保险", school: "刷题/王书",
            question: "名词解释：商业财产险与责任险。",
            answer: "答：财产险：保护有形财产。责任险：赔偿第三者损害。"
        }
    ];

    let currentTab = 'all';
    let wrongList = JSON.parse(localStorage.getItem('wrongList_IB_MEGA_V2')) || []; 
    let isAllExpanded = false;

    const questionList = document.getElementById('question-list');
    const tabAll = document.getElementById('tab-all');
    const tabWrong = document.getElementById('tab-wrong');
    const wrongCountSpan = document.getElementById('wrong-count');
    const clearWrongBtn = document.getElementById('clear-wrong-btn');
    const statsText = document.getElementById('stats-text');

    function init() {
        updateWrongCount();
        renderQuestions();
        switchTab('all');
    }

    function updateWrongCount() {
        wrongCountSpan.textContent = wrongList.length;
    }

    function switchTab(tab) {
        currentTab = tab;
        isAllExpanded = false;
        
        if (tab === 'all') {
            tabAll.classList.add('active');
            tabWrong.classList.remove('active');
            clearWrongBtn.style.display = 'none';
        } else {
            tabWrong.classList.add('active');
            tabAll.classList.remove('active');
            clearWrongBtn.style.display = 'block';
        }
        renderQuestions();
    }

    function renderQuestions() {
        questionList.innerHTML = '';
        let dataToRender = questionsData;
        
        if (currentTab === 'wrong') {
            dataToRender = questionsData.filter(q => wrongList.includes(q.id));
        }

        if (dataToRender.length === 0) {
            statsText.textContent = currentTab === 'all' ? `共 ${questionsData.length} 道核心题` : '错题本空空如也，继续加油！';
            if (currentTab === 'wrong') {
                questionList.innerHTML = '<div class="empty-state">暂时没有错题，快去刷题吧！</div>';
            }
            return;
        }

        statsText.textContent = `当前显示 ${dataToRender.length} 道题`;

        let currentChapter = "";

        dataToRender.forEach(q => {
            if (q.chapter !== currentChapter) {
                currentChapter = q.chapter;
                const headerDiv = document.createElement('div');
                headerDiv.className = 'chapter-header';
                headerDiv.innerText = currentChapter;
                questionList.appendChild(headerDiv);
            }

            const isWrong = wrongList.includes(q.id);
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <div>
                    <span class="source-tag">来源: ${q.school}</span>
                    <div class="question-title">${q.question}</div>
                </div>
                <div class="answer-content" id="answer-${q.id}">
                    ${q.answer}
                </div>
                <div class="btn-group">
                    <button class="action-btn btn-toggle" onclick="toggleAnswer(${q.id})">显示/隐藏答案</button>
                    <button class="action-btn btn-wrong ${isWrong ? 'active' : ''}" onclick="toggleWrong(${q.id})">
                        ${isWrong ? '移出错题本' : '加入错题本'}
                    </button>
                </div>
            `;
            questionList.appendChild(card);
        });
    }

    function toggleAnswer(id) {
        const answerDiv = document.getElementById(`answer-${id}`);
        if (answerDiv) {
            answerDiv.classList.toggle('show');
        }
    }

    function toggleAllAnswers() {
        isAllExpanded = !isAllExpanded;
        const answerDivs = document.querySelectorAll('.answer-content');
        answerDivs.forEach(div => {
            if (isAllExpanded) {
                div.classList.add('show');
            } else {
                div.classList.remove('show');
            }
        });
    }

    function toggleWrong(id) {
        const index = wrongList.indexOf(id);
        if (index > -1) {
            wrongList.splice(index, 1);
        } else {
            wrongList.push(id);
        }
        localStorage.setItem('wrongList_IB_MEGA_V2', JSON.stringify(wrongList));
        updateWrongCount();
        renderQuestions(); 
    }

    function clearWrongBook() {
        if (confirm('确定要清空错题本吗？此操作不可撤销。')) {
            wrongList = [];
            localStorage.setItem('wrongList_IB_MEGA_V2', JSON.stringify(wrongList));
            updateWrongCount();
            renderQuestions();
        }
    }

    init();
</script>
</body>
</html>
